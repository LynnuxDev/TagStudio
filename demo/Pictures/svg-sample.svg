<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>

  <!-- Overlapping circles -->
  <circle cx="80" cy="85" r="40" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <circle cx="120" cy="85" r="40" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="120" r="40" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

  <!-- Hexagon in center -->
  <polygon points="100,65 125,82 125,108 100,125 75,108 75,82" fill="url(#grad2)" stroke="#ffffff" stroke-width="2"/>

  <!-- Inner circle -->
  <circle cx="100" cy="95" r="15" fill="#ffffff" opacity="0.9"/>
</svg>