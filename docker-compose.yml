services:
  tagger:
    build: .
    container_name: tagger
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - /path/to/your/files:/files
    environment:
      - ROOT=/files
      - PORT=3000
      - DATA_DIR=/data
      - BASE_URL=http://localhost:3000
      - NODE_ENV=production
