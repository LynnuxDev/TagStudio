# ========================================
# Docker Compose Configuration
# Node.js Application
# ========================================

services:
  tagger:
    build:
      context: .
      target: production
    container_name: tagger
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ${HOME}:/host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - ROOT=/host
      - PORT=3000
      - DATA_DIR=/data
      - BASE_URL=http://localhost:3000
      # Generate one: openssl rand -base64 32
      # (Compose fails fast if it is missing — never commit a real value here.)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in your shell before running compose}
      - NODE_ENV=${NODE_ENV:-production}
