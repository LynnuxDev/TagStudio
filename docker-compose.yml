# ========================================
# Docker Compose Configuration
# Node.js Application
# ========================================

services:
  tagger:
    build:
      context: .
      target: production
    container_name: tagger
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - /path/to/your/files:/files
    environment:
      - ROOT=/files
      - PORT=3000
      - DATA_DIR=/data
      - BASE_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=change-me-to-a-random-string
      - NODE_ENV=production
